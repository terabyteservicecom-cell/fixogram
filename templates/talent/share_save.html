{% load talent_tags %}
{% absolute_url share_path as share_url %}
<div class="share-save">
  <details class="share-pop">
    <summary class="share-icon" aria-label="اشتراک" title="اشتراک">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
      </svg>
    </summary>
    <div class="share-menu">
      <button type="button" data-copy-link="{{ share_url }}">کپی لینک</button>
      <a class="share-net tg" href="https://t.me/share/url?url={{ share_url|urlencode }}&text={{ title|urlencode }}" target="_blank" rel="noopener noreferrer">تلگرام</a>
      <a class="share-net wa" href="https://wa.me/?text={{ title|urlencode }}%20{{ share_url|urlencode }}" target="_blank" rel="noopener noreferrer">واتساپ</a>
    </div>
  </details>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'toggle_bookmark' %}">
      {% csrf_token %}
      <input type="hidden" name="kind" value="{{ kind }}">
      <input type="hidden" name="id" value="{{ object_id }}">
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="save-icon{% if saved %} is-saved{% endif %}" aria-label="{% if saved %}برداشتن از ذخیره{% else %}ذخیره{% endif %}" title="{% if saved %}برداشتن از ذخیره{% else %}ذخیره{% endif %}">
        {% if saved %}
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
          </svg>
        {% else %}
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/>
          </svg>
        {% endif %}
      </button>
    </form>
  {% else %}
    <a class="share-save-link save-icon" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" aria-label="ذخیره" title="ذخیره">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/>
      </svg>
    </a>
  {% endif %}
</div>
