{% if profile.instagram or profile.telegram or profile.whatsapp or profile.website %}
<ul class="socials">
  {% if profile.instagram %}
    <li>
      <a class="social-logo ig" href="{{ profile.instagram_url }}" target="_blank" rel="noopener noreferrer" aria-label="اینستاگرام" title="اینستاگرام">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>
      </a>
    </li>
  {% endif %}
  {% if profile.telegram %}
    <li>
      <a class="social-logo tg" href="{{ profile.telegram_url }}" target="_blank" rel="noopener noreferrer" aria-label="تلگرام" title="تلگرام">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 4.5 3.8 10.8c-.9.3-.9 1.6.1 1.9l4.3 1.3 1.6 5c.3.8 1.3.9 1.8.2l2.3-3 4.4 3.2c.7.5 1.7.1 1.9-.7l2.4-12.4c.2-1-.7-1.8-1.7-1.5zM9.2 13.2l8.6-5.4-6.7 6.5-.3 2.6-1.6-3.7z"/></svg>
      </a>
    </li>
  {% endif %}
  {% if profile.whatsapp %}
    <li>
      <a class="social-logo wa" href="{{ profile.whatsapp_url }}" target="_blank" rel="noopener noreferrer" aria-label="واتساپ" title="واتساپ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.5a8.2 8.2 0 0 0-7 12.4L4 20.2l4.5-1.2A8.2 8.2 0 1 0 12 3.5zm0 1.8a6.4 6.4 0 0 1 5.4 9.7l-.3.5 1 3.2-3.3-.9-.5.2A6.4 6.4 0 1 1 12 5.3z"/><path fill="currentColor" d="M9.1 8.7c.2-.4.4-.4.6-.4h.5c.2 0 .4 0 .5.4.2.6.7 2 .7 2.1.1.2 0 .3-.2.5l-.4.4c-.1.1-.2.3 0 .5.4.6 1.1 1.3 1.8 1.6.2.1.4 0 .5-.1l.5-.5c.2-.2.3-.1.5-.1 1.1.3 1.3.5 1.4.7.1.4-.3 1.4-.8 1.8-.5.4-1.2.5-1.9.3-1.6-.4-3.5-1.6-4.6-3.4-1-1.5-1.2-2.7-1-3.3.1-.5.6-1 .9-1.1z"/></svg>
      </a>
    </li>
  {% endif %}
  {% if profile.website %}
    <li>
      <a class="social-logo web" href="{{ profile.website_url }}" target="_blank" rel="noopener noreferrer" aria-label="وب‌سایت" title="وب‌سایت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="12" rx="3.4" ry="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 12h16M6.2 8h11.6M6.2 16h11.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </a>
    </li>
  {% endif %}
</ul>
{% endif %}
